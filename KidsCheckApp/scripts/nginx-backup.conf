# ============================================================================
# Nginx 配置片段：备份文件下载（带 Basic Auth 保护）
# ============================================================================
#
# 使用方法：
#
# 1. 将以下 location 块添加到 Nginx 的 server 配置中。
#
# 2. 创建 Basic Auth 密码文件（首次）：
#      sudo apt install apache2-utils
#      sudo htpasswd -c /etc/nginx/.htpasswd kidscheck
#    添加更多用户（不加 -c）：
#      sudo htpasswd /etc/nginx/.htpasswd another_user
#
# 3. 测试并重载 Nginx 配置：
#      sudo nginx -t && sudo nginx -s reload
#
# 4. 访问方式：
#      浏览器打开 https://your-server/backups/ 并输入用户名密码
#      命令行：curl -u kidscheck:password https://your-server/backups/
#
# 注意：backup.sh 会将备份文件存放到 /var/backups/kidscheck/ 目录，
#       请确保 Nginx worker 进程有该目录的读取权限。
# ============================================================================

location /backups/ {
    # Basic Auth 保护
    auth_basic           "KidsCheck Backup Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 启用目录列表（方便浏览和下载备份文件）
    autoindex on;
    autoindex_exact_size off;   # 显示近似文件大小（KB/MB）
    autoindex_localtime on;     # 使用本地时间显示

    # 指向备份存储目录
    alias /var/backups/kidscheck/;
}
